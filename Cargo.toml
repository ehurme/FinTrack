[package]
name = "fintrack"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Interactive marine animal tracker: GPS and Argos tracks, dive profiles in 3D over the seafloor, ocean (waves, currents, SST) and weather annotation, ship traffic and offshore wind farms"
license = "MIT"
authors = ["Edward Hurme"]
repository = "https://github.com/ehurme/fintrack"

[lib]
name = "fintrack"
path = "src/lib.rs"

[[bin]]
name = "fintrack"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.37"
egui_plot = "0.38"
walkers = "0.63"
ehttp = "0.7"
csv = "1.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1.0"
flate2 = "1"
log = "0.4"
gif = "0.14.2"
base64 = "0.22"
png = "0.18"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = "0.17"
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["wasmbind"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
rfd = { version = "0.17", default-features = false }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "History",
    "Location",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Storage",
] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
